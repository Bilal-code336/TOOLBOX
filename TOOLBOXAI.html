<!DOCTYPE html>
<html lang="es" translate="yes">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOOLBOX AI — Inteligencia artificial online</title>
<meta name="description" content="TOOLBOX AI, el asistente de inteligencia artificial de TOOLBOX. Conversa, aprende, programa, escribe y resuelve dudas online.">
<meta name="theme-color" content="#080b12">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="canonical" href="https://toolbox-zci6.onrender.com/TOOLBOXAI">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
:root{
  --bg:#080b12;--bg2:#0c111c;--card:#111827;--card2:#0d131f;--panel:#101724;--input:#080d16;
  --border:#29344a;--border2:#344158;--text:#fff;--text2:#d5dbe6;--muted:#8995aa;
  --purple:#7c3aed;--purple2:#8b5cf6;--purple3:#a78bfa;--button:#202a3d;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#38bdf8;
  --shadow:0 18px 50px rgba(0,0,0,.35);--ease:cubic-bezier(.2,.8,.2,1);
}
body.light{
  --bg:#f4f6f9;--bg2:#fff;--card:#fff;--card2:#f4f6f8;--panel:#fff;--input:#f1f3f5;
  --border:#d9dee7;--border2:#c7ced9;--text:#111827;--text2:#374151;--muted:#5f6b7a;--button:#e6eaf0;
  --shadow:0 18px 50px rgba(15,23,42,.14);
}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;line-height:1.5;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:inherit}
kbd{font-family:inherit;font-size:10px;padding:2px 6px;border:1px solid var(--border2);border-radius:6px;color:var(--muted);background:var(--card2)}
:focus-visible{outline:2px solid var(--purple3);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:9px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box;border:2px solid transparent}

.app{display:flex;height:100vh;height:100dvh;position:relative;background:radial-gradient(circle at 70% -10%,rgba(124,58,237,.14),transparent 45%),var(--bg)}

/* ---------- SIDEBAR ---------- */
.sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;padding:16px 14px 12px;background:var(--bg2);border-right:1px solid var(--border);z-index:30;transition:transform .3s var(--ease)}
.sb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand strong{display:block;font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px}
.brand-logo{position:relative;width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#20283a,#0b1019);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 22px rgba(124,58,237,.25)}
.brand-logo span{position:absolute;line-height:1}.brand-logo span:first-child{font-size:19px;transform:translate(-3px,-3px)}.brand-logo span:last-child{font-size:9px;transform:translate(8px,7px);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.45;transform:translate(8px,7px) scale(.8)}50%{opacity:1;transform:translate(8px,7px) scale(1.2)}}
.icon-btn{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:var(--button);color:var(--text);transition:transform .2s var(--ease),background .2s}
.icon-btn:hover{background:var(--purple);color:#fff;transform:translateY(-1px)}
.sb-close{display:none}
.new-chat{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--purple),#6d28d9);box-shadow:0 8px 24px rgba(124,58,237,.3);transition:transform .2s var(--ease),box-shadow .2s}
.new-chat:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(124,58,237,.42)}
.new-chat kbd{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);color:#fff}
.search{display:flex;align-items:center;gap:6px;margin:14px 0 8px;padding:0 10px 0 13px;background:var(--input);border:1px solid var(--border);border-radius:13px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(139,92,246,.12)}
.search span{color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:none;outline:none;padding:11px 2px;font-size:13px}
.search button{color:var(--muted);font-size:12px;padding:4px}
.conv-list{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px}
.group-label{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 10px 6px}
.conv-item{position:relative;display:flex;align-items:center;gap:6px;padding:9px 8px 9px 12px;border-radius:12px;color:var(--muted);cursor:pointer;transition:background .18s,color .18s;animation:slideIn .35s var(--ease) both;animation-delay:calc(var(--i,0)*18ms)}
.conv-item::before{content:"";position:absolute;left:0;top:50%;width:3px;height:0;border-radius:3px;background:var(--purple2);transform:translateY(-50%);transition:height .25s var(--ease)}
.conv-item:hover{background:var(--button);color:var(--text)}
.conv-item.active{background:rgba(124,58,237,.16);color:var(--text)}
.conv-item.active::before{height:55%}
.conv-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.conv-title.titling{background:linear-gradient(90deg,var(--muted) 20%,var(--purple3) 50%,var(--muted) 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.3s linear infinite}
.conv-pin{font-size:11px;opacity:.8}
.conv-actions{display:none;gap:2px;flex-shrink:0}
.conv-item:hover .conv-actions,.conv-item:focus-within .conv-actions{display:flex}
.conv-item:hover .conv-pin,.conv-item:focus-within .conv-pin{display:none}
.mini{width:26px;height:26px;border-radius:8px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.mini:hover{background:var(--card);color:var(--text)}.mini.danger:hover{background:rgba(239,68,68,.16);color:var(--red)}
.rename-input{flex:1;min-width:0;background:var(--input);border:1px solid var(--purple2);border-radius:8px;padding:5px 8px;font-size:13.5px;outline:none;box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.empty-list{padding:28px 10px;text-align:center;color:var(--muted);font-size:13px}
.sb-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:8px}
.status{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.status strong{display:block;font-size:12px}.status small{color:var(--muted);font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(34,197,94,.55);animation:pulse 2.2s ease-in-out infinite}
.dot.off{background:var(--red);box-shadow:0 0 10px rgba(239,68,68,.55);animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.foot-note{color:#68758a;font-size:10.5px;line-height:1.4}
.link-btn{color:var(--muted);font-size:11px;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}.link-btn:hover{color:var(--red)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}

/* ---------- MAIN / HEADER ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:10px 20px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);z-index:10}
.head-left{display:flex;align-items:center;gap:12px;min-width:0}
.menu-btn{display:none}
.head-icon{width:38px;height:38px;border-radius:12px;background:var(--button);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--purple3)}
.head-title{min-width:0}
.title-row{display:flex;align-items:center;gap:6px;min-width:0}
.title-text{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;border-radius:7px;padding:1px 4px;margin-left:-4px;transition:background .15s}
.title-text:hover{background:var(--button)}
.title-text.titling{background:linear-gradient(90deg,var(--muted) 20%,var(--purple3) 50%,var(--muted) 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}
.head-title small{color:var(--muted);font-size:11.5px}
.head-right{display:flex;align-items:center;gap:8px;position:relative}
.menu{position:absolute;right:0;top:46px;min-width:250px;padding:6px;background:var(--panel);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);z-index:40;animation:pop .18s var(--ease)}
.menu button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13.5px;text-align:left;color:var(--text2);transition:background .15s}
.menu button:hover{background:var(--button);color:var(--text)}.menu button.danger:hover{background:rgba(239,68,68,.14);color:var(--red)}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- MENSAJES ---------- */
.messages{flex:1;overflow-y:auto;padding:26px 24px 10px;scroll-behavior:smooth}
.thread{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:10px}
.ai-row{display:flex;gap:12px;align-items:flex-start;min-width:0}
.ai-row.user{justify-content:flex-end}
.ai-row.is-new{animation:msgIn .4s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.avatar{width:34px;height:34px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#20283a,#0b1019);color:#fff;border:1px solid rgba(255,255,255,.08);font-size:15px;box-shadow:0 0 18px rgba(124,58,237,.2)}
.ai-col{min-width:0;max-width:min(780px,100%);display:flex;flex-direction:column;gap:5px}
.ai-row.user .ai-col{align-items:flex-end;max-width:min(680px,88%)}
.ai-bubble{padding:14px 18px;border-radius:20px;background:var(--card);border:1px solid var(--border);line-height:1.7;overflow-wrap:anywhere;min-width:0;box-shadow:0 6px 22px rgba(0,0,0,.12)}
.ai-row.user .ai-bubble{background:linear-gradient(135deg,var(--purple),#6d28d9);border-color:transparent;color:#fff;white-space:pre-wrap;border-bottom-right-radius:7px}
.ai-row.bot .ai-bubble{border-top-left-radius:7px}
.ai-bubble.is-error{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.08)}
.ai-bubble.streaming::after{content:"";display:inline-block;width:8px;height:1.1em;margin-left:3px;vertical-align:-.2em;border-radius:2px;background:var(--purple3);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ai-meta{display:flex;align-items:center;gap:4px;min-height:26px;opacity:0;transition:opacity .2s;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.ai-row:hover .ai-meta,.ai-row:focus-within .ai-meta,.ai-row.show-meta .ai-meta{opacity:1}
.ai-meta .time{margin:0 6px}
.act{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;color:var(--muted);transition:background .15s,color .15s}
.act:hover{background:var(--button);color:var(--text)}
.act.ok{color:var(--green)}
.style-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(139,92,246,.18);color:var(--purple3);border:1px solid rgba(139,92,246,.35)}
.typing-row .ai-bubble{display:flex;align-items:center;gap:12px;padding:12px 16px}
.dots{display:flex;gap:5px}.dots span{width:7px;height:7px;border-radius:50%;background:var(--purple3);animation:bounce 1s infinite ease-in-out}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
.typing-label{font-size:13px;color:var(--muted)}
.fab{position:absolute;right:28px;bottom:150px;width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--border2);box-shadow:var(--shadow);color:var(--text);font-size:18px;z-index:12;animation:pop .2s var(--ease);transition:transform .2s,background .2s}
.fab:hover{background:var(--purple);transform:translateY(-3px)}

/* ---------- BIENVENIDA ---------- */
.welcome{max-width:820px;margin:7vh auto 0;text-align:center}
.welcome-logo{width:84px;height:84px;margin:0 auto 22px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;background:linear-gradient(145deg,#26304a,#0b1019);border:1px solid rgba(255,255,255,.1);box-shadow:0 0 60px rgba(124,58,237,.35);animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(3deg)}}
.welcome h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1.2px;margin-bottom:12px;animation:msgIn .6s var(--ease) both}
.welcome h1 span{background:linear-gradient(135deg,var(--purple3),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);line-height:1.65;max-width:600px;margin:0 auto 30px;animation:msgIn .6s .08s var(--ease) both}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;text-align:left}
.card-s{display:flex;gap:12px;align-items:flex-start;padding:15px;border-radius:16px;background:var(--card);border:1px solid var(--border);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;animation:msgIn .55s var(--ease) both;animation-delay:calc(.12s + var(--i)*60ms)}
.card-s:hover{transform:translateY(-4px);border-color:rgba(139,92,246,.7);box-shadow:0 16px 40px rgba(0,0,0,.25)}
.card-s .ic{font-size:24px;line-height:1.2}
.card-s strong{display:block;font-size:14px;margin-bottom:2px}.card-s small{color:var(--muted);font-size:12.5px;line-height:1.4}

/* ---------- COMPOSER ---------- */
.composer-wrap{padding:6px 24px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.chips{max-width:860px;margin:0 auto 8px;display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--border);transition:all .2s var(--ease);white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--purple2);transform:translateY(-2px)}
.chip.on{color:#fff;background:linear-gradient(135deg,var(--purple),#6d28d9);border-color:transparent;box-shadow:0 6px 18px rgba(124,58,237,.35)}
.composer{max-width:860px;margin:0 auto;border-radius:22px;background:var(--input);border:1px solid var(--border);box-shadow:0 10px 35px rgba(0,0,0,.18);transition:border-color .2s,box-shadow .2s;overflow:hidden}
.composer:focus-within{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(139,92,246,.14),0 10px 35px rgba(0,0,0,.18)}
#aiInput{display:block;width:100%;min-height:58px;max-height:200px;resize:none;border:none;outline:none;background:transparent;padding:17px 18px 6px;font-size:15px;line-height:1.55}
#aiInput::placeholder{color:#68758a}
.composer-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 10px 10px 16px}
.style-hint{font-size:12px;color:var(--purple3);min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
#counter{color:#68758a;font-size:11px;font-variant-numeric:tabular-nums}#counter.warn{color:var(--amber)}#counter.max{color:var(--red)}
.send{width:42px;height:42px;border-radius:50%;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--purple),#6d28d9);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease),box-shadow .2s;box-shadow:0 6px 18px rgba(124,58,237,.4)}
.send:hover:not(:disabled){transform:scale(1.08) rotate(-6deg)}
.send.stop{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 6px 18px rgba(239,68,68,.4);animation:pulseStop 1.6s infinite}
@keyframes pulseStop{50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.disclaimer{max-width:860px;margin:8px auto 0;text-align:center;color:#64748b;font-size:10.5px}

/* ---------- TOASTS / MODAL ---------- */
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:13px;background:var(--panel);border:1px solid var(--border2);box-shadow:var(--shadow);font-size:13.5px;pointer-events:auto;animation:toastIn .3s var(--ease) both}
.toast.out{animation:toastOut .25s ease forwards}
.toast button{color:var(--purple3);font-weight:700;font-size:13px}.toast button:hover{text-decoration:underline}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.96)}}
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dialog{width:min(420px,100%);padding:24px;border-radius:20px;background:var(--panel);border:1px solid var(--border2);box-shadow:var(--shadow);animation:pop .25s var(--ease)}
.dialog h3{font-size:18px;margin-bottom:8px}.dialog p{color:var(--muted);font-size:14px;line-height:1.6}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.btn{padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;background:var(--button);color:var(--text);transition:transform .2s,background .2s}.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--purple),#6d28d9);color:#fff}.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}

/* ---------- MARKDOWN ---------- */
.md{word-break:break-word}
.md>*:first-child{margin-top:0!important}.md>*:last-child{margin-bottom:0!important}
.md p{margin:0 0 12px}
.md h1,.md h2,.md h3,.md h4{margin:22px 0 10px;line-height:1.3;color:var(--text)}
.md h1{font-size:1.5rem;padding-bottom:8px;border-bottom:1px solid var(--border)}
.md h2{font-size:1.28rem;display:flex;align-items:center;gap:9px}
.md h2::before{content:"";width:4px;height:1.1em;border-radius:3px;background:linear-gradient(var(--purple2),var(--purple));flex-shrink:0}
.md h3{font-size:1.1rem;color:var(--purple3)}
.md h4{font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.md strong{font-weight:800;color:var(--text)}
.md em{font-style:italic}
.md del{color:var(--muted);text-decoration-thickness:2px}
.md mark{background:linear-gradient(transparent 8%,rgba(250,204,21,.38) 8%);color:inherit;padding:0 3px;border-radius:4px}
body.light .md mark{background:linear-gradient(transparent 8%,rgba(250,204,21,.6) 8%)}
.md u.ul{text-decoration:underline;text-decoration-color:var(--purple2);text-decoration-thickness:2.5px;text-underline-offset:4px}
.md hr{border:0;height:1px;margin:20px 0;background:linear-gradient(90deg,transparent,var(--border2),transparent)}
.md a{color:var(--purple3);text-decoration:underline;text-underline-offset:3px}.md a:hover{color:#c4b5fd}
.md ul,.md ol{margin:6px 0 14px 4px;padding-left:22px}
.md ul ul,.md ul ol,.md ol ul,.md ol ol{margin:4px 0 4px}
.md li{margin:5px 0;padding-left:3px}.md li::marker{color:var(--purple3);font-weight:700}
.md li.md-task{list-style:none;margin-left:-20px;display:flex;gap:9px;align-items:flex-start}

<script>
/* =========================================================
   TOOLBOX AI — CONFIGURACIÓN
========================================================= */
const CFG = {
  endpoint: '/api/ai',      // tu servidor (TOOLBOXMOTOR.py)
  mode: 'normal',           // modo que se envía al servidor
  storageKey: 'toolboxConversations',
  themeKey: 'toolboxTheme',
  sendFormatHint: true,     // envía al modelo las reglas de formato (esquemas, tablas, resaltado…)
  autoTitle: true,          // la IA elige el nombre de cada conversación
  typewriter: true,         // efecto de escritura progresiva
  maxHistory: 24            // mensajes anteriores enviados como contexto
};

const FORMAT_HINT =
  'Puedes usar Markdown cuando mejore la lectura: títulos (## y ###), listas con sangría, **negrita**, ==resaltado== para lo más importante, ' +
  '++subrayado++ para términos clave, ~~tachado~~, tablas, listas de tareas (- [ ] / - [x]), citas, avisos con esta forma ' +
  '(> 💡 **Consejo:** …, > ⚠️ **Ojo:** …, > ℹ️ **Nota:** …), bloques de código indicando el lenguaje y esquemas visuales dentro de un bloque ```esquema ' +
  '(tema central en la primera línea y ramas con sangría de 2 espacios, sin viñetas ni símbolos). ' +
  'Si el usuario solo conversa o hace una pregunta corta, responde en texto natural sin formato pesado. No uses más de un esquema por respuesta salvo que lo pidan.';

const STYLES = [
  { id: 'esquema', icon: '📋', label: 'Esquema',  hint: 'Se responderá en forma de esquema visual',
    prompt: 'El usuario quiere un ESQUEMA: responde con un bloque ```esquema (tema central en la primera línea y ramas con sangría de 2 espacios) y, si hace falta, un breve resumen debajo con ==lo esencial resaltado==.' },
  { id: 'resumen', icon: '📝', label: 'Resumen',  hint: 'Se responderá con un resumen claro',
    prompt: 'Haz un RESUMEN claro: una frase con la idea principal y de 3 a 6 puntos clave, con ==lo más importante resaltado==.' },
  { id: 'facil',   icon: '🧒', label: 'Explícamelo fácil', hint: 'Se explicará con palabras sencillas y un ejemplo',
    prompt: 'Explícalo FÁCIL, como a alguien sin conocimientos previos: usa una analogía cotidiana y un ejemplo concreto. Resalta con ==marcador== las ideas clave.' },
  { id: 'pasos',   icon: '🪜', label: 'Paso a paso', hint: 'Se responderá con pasos numerados',
    prompt: 'Responde PASO A PASO con una lista numerada; cada paso debe ser una acción concreta. Añade un aviso final con > 💡 **Consejo:** si procede.' },
  { id: 'tabla',   icon: '📊', label: 'Tabla',     hint: 'Se responderá con una tabla comparativa',
    prompt: 'Responde con una TABLA comparativa en Markdown (columnas claras) y una conclusión breve debajo.' },
  { id: 'test',    icon: '🧪', label: 'Test',      hint: 'Se creará un test para practicar',
    prompt: 'Crea un pequeño TEST de 5 preguntas con opciones A-D. Pon las respuestas correctas al final, bajo un título "Soluciones".' }
];

const SUGGESTIONS = [
  { icon: '📋', title: 'Hazme un esquema', hint: 'Organiza cualquier tema en un mapa visual', text: 'Hazme un esquema sobre el sistema solar', style: 'esquema', send: false },
  { icon: '🌱', title: 'Explícame algo', hint: 'Con palabras sencillas y ejemplos', text: 'Explícame la fotosíntesis de forma sencilla.', style: 'facil' },
  { icon: '🐍', title: 'Aprende conmigo', hint: 'Una clase paso a paso', text: 'Quiero aprender Python desde cero. Haz de profesor y enséñame paso a paso.', style: 'pasos' },
  { icon: '💻', title: 'Ayúdame a programar', hint: 'Código con colores y botón de copiar', text: 'Escríbeme una función en JavaScript que valide un email y explícame cómo funciona.' },
  { icon: '📊', title: 'Compara opciones', hint: 'Tablas claras para decidir mejor', text: 'Compara PNG, JPG y WebP: cuándo conviene cada formato.', style: 'tabla' },
  { icon: '🧠', title: 'Ponme a prueba', hint: 'Un test para practicar', text: 'Hazme un test sobre la Segunda Guerra Mundial.', style: 'test', send: false }
];

/* =========================================================
   UTILIDADES
========================================================= */
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '';

/* =========================================================
   MARKDOWN → HTML (seguro: todo se escapa antes)
========================================================= */
const MD = (() => {
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  /* ---- resaltado de código ---- */
  const KW = {
    js: 'break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new of return super switch this throw try typeof var void while with yield async await static get set null undefined true false',
    py: 'and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield self print',
    java: 'abstract boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long new null package private protected public return short static super switch this throw throws try void volatile while true false var string bool',
    c: 'auto break case char const continue default do double else enum extern float for goto if int long register return short signed sizeof static struct switch typedef union unsigned void volatile while NULL true false include define',
    go: 'break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var nil true false',
    rust: 'as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while',
    php: 'echo function return if else elseif foreach for while class new public private protected static null true false array use namespace',
    sh: 'if then else elif fi for while do done case esac function in echo cd ls export source sudo apt git npm pip',
    sql: 'select from where insert into values update set delete create table alter drop join left right inner outer on group by order having limit as and or not null primary key foreign references distinct union like in between is count sum avg max min'
  };
  const KWSET = {}; Object.keys(KW).forEach(k => KWSET[k] = new Set(KW[k].split(' ')));
  const ALIAS = { javascript: 'js', js: 'js', jsx: 'js', ts: 'js', typescript: 'js', tsx: 'js', node: 'js', python: 'py', py: 'py', java: 'java', kotlin: 'java', cs: 'java', csharp: 'java', c: 'c', cpp: 'c', 'c++': 'c', h: 'c', go: 'go', rust: 'rust', rs: 'rust', php: 'php', bash: 'sh', sh: 'sh', shell: 'sh', zsh: 'sh', sql: 'sql', json: 'json', css: 'css', scss: 'css', html: 'markup', xml: 'markup', svg: 'markup', vue: 'markup' };
  const RX = {
    c: /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\[\s\S])*`)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*\b)(\s*\()?/g,
    h: /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*\b)(\s*\()?/g,
    s: /(--[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*\b)(\s*\()?/g,
    json: /("(?:[^"\\\n]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)/g,
    markup: /(<!--[\s\S]*?-->)|(<\/?[\w:-]+)|(\/?>)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,
    css: /(\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(#[0-9a-fA-F]{3,8}\b)|(-?\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|deg)?)|([\w-]+)(?=\s*:)/g
  };
  const span = (c, t) => '<span class="' + c + '">' + esc(t) + '</span>';

  function highlight(code, lang) {
    const fam = ALIAS[lang];
    if (!fam || code.length > 20000) return esc(code);
    const rx = fam === 'json' ? RX.json : fam === 'markup' ? RX.markup : fam === 'css' ? RX.css : (fam === 'py' || fam === 'sh') ? RX.h : fam === 'sql' ? RX.s : RX.c;
    const kws = KWSET[fam];
    rx.lastIndex = 0;
    let out = '', last = 0, m;
    while ((m = rx.exec(code))) {
      out += esc(code.slice(last, m.index));
      last = m.index + m[0].length;
      if (fam === 'json') {
        if (m[1]) out += span(m[2] ? 'tok-p' : 'tok-s', m[1]) + esc(m[2] || '');
        else if (m[3]) out += span('tok-k', m[3]);
        else out += span('tok-n', m[4]);
      } else if (fam === 'markup') {
        out += m[1] ? span('tok-c', m[1]) : (m[2] || m[3]) ? span('tok-t', m[0]) : span('tok-s', m[4]);
      } else if (fam === 'css') {
        out += m[1] ? span('tok-c', m[1]) : m[2] ? span('tok-s', m[2]) : (m[3] || m[4]) ? span('tok-n', m[0]) : span('tok-p', m[5]);
      } else {
        if (m[1]) out += span('tok-c', m[1]);
        else if (m[2]) out += span('tok-s', m[2]);
        else if (m[3]) out += span('tok-n', m[3]);
        else {
          const w = fam === 'sql' ? m[4].toLowerCase() : m[4];
          if (kws && kws.has(w)) out += span('tok-k', m[4]) + esc(m[5] || '');
          else if (m[5]) out += span('tok-f', m[4]) + esc(m[5]);
          else out += esc(m[4]);
        }
      }
      if (rx.lastIndex === m.index) rx.lastIndex++;
    }
    return out + esc(code.slice(last));
  }

  /* ---- inline ---- */
  function fmt(t) {
    return t
      .replace(/\*\*\*(?=\S)([^*\n]*?\S)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(?=\S)([^*\n]*?\S)\*\*/g, '<strong>$1</strong>')
      .replace(/__(?=\S)([^_\n]*?\S)__/g, '<strong>$1</strong>')
      .replace(/~~(?=\S)([^~\n]*?\S)~~/g, '<del>$1</del>')
      .replace(/(^|[^\w=])==(?=\S)([^=\n]*?\S)==(?![\w=])/g, '$1<mark>$2</mark>')
      .replace(/(^|[^\w+])\+\+(?=\S)([^+\n]*?\S)\+\+(?![\w+])/g, '$1<u class="ul">$2</u>')
      .replace(/(^|[^\w*])\*(?=\S)([^*\n]*?\S)\*(?![\w*])/g, '$1<em>$2</em>')
      .replace(/(^|[^\w_])_(?=\S)([^_\n]*?\S)_(?![\w_])/g, '$1<em>$2</em>');
  }
  function inline(raw) {
    let t = esc(raw);
    const st = [];
    const keep = h => { st.push(h); return '\u0000' + (st.length - 1) + '\u0001'; };
    t = t.replace(/`([^`\n]+)`/g, (_, c) => keep('<code>' + c + '</code>'));
    t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g, (_, txt, url) => keep('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + fmt(txt) + '</a>'));
    t = t.replace(/(^|[\s(])(https?:\/\/[^\s<]*[^\s<.,;:!?)\]])/g, (_, p, url) => p + keep('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>'));
    t = fmt(t);
    for (let i = 0; i < 3 && /\u0000\d+\u0001/.test(t); i++) t = t.replace(/\u0000(\d+)\u0001/g, (_, n) => st[+n]);
    return t.replace(/\n/g, '<br>');
  }

  /* ---- bloques ---- */
  function codeBlock(code, lang) {
    return '<div class="md-code"><div class="md-code-head"><span class="md-lang">' + esc(lang || 'código') + '</span>' +
      '<button class="md-copy" type="button" data-act="copycode">Copiar</button></div><pre><code>' + highlight(code, lang) + '</code></pre></div>';
  }

  function scheme(code) {
    const rows = code.split('\n').map(l => l.replace(/\t/g, '    ')).filter(l => l.trim());
    if (rows.length < 2) return null;
    const items = rows.map(l => {
      const m = l.match(/^([\s│├└─┬┴┼|`'\-*+•·>→▸▪◦●○]*)(.*)$/u);
      return { indent: m[1].length, text: m[2].trim() };
    }).filter(it => it.text);
    const stack = [];
    items.forEach(it => {
      while (stack.length && stack[stack.length - 1] >= it.indent) stack.pop();
      it.level = stack.length;
      stack.push(it.indent);
    });
    let html = '', cur = -1;
    items.forEach((it, i) => {
      if (i === 0) html += '<ul class="md-tree"><li style="--d:0">';
      else if (it.level > cur) html += '<ul><li style="--d:' + i + '">';
      else html += '</li>' + '</ul></li>'.repeat(cur - it.level) + '<li style="--d:' + i + '">';
      html += '<span class="md-node">' + inline(it.text) + '</span>';
      cur = it.level;
    });
    html += '</li>' + '</ul></li>'.repeat(Math.max(cur, 0)) + '</ul>';
    return '<div class="md-scheme"><div class="md-scheme-label">📋 Esquema</div>' + html + '</div>';
  }

  const SEP = { test: l => l.indexOf('|') >= 0 && /^[\s|:-]+$/.test(l) && l.indexOf('-') >= 0 };
  const LIST = /^(\s*)([-*+•]|\d{1,3}[.)])\s+(.*)$/;
  const HR = /^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/;
  const HEAD = /^\s{0,3}(#{1,4})\s+(.+?)\s*#*\s*$/;
  const FENCE = /^\s*(?:```|~~~)\s*([\w+#.-]*)\s*$/;
  const QUOTE = /^\s{0,3}>\s?(.*)$/;
  const splitRow = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());

  const CALL = {
    note: ['note', 'ℹ️', 'Nota'], info: ['note', 'ℹ️', 'Nota'], tip: ['tip', '💡', 'Consejo'], consejo: ['tip', '💡', 'Consejo'],
    important: ['idea', '✨', 'Importante'], idea: ['idea', '✨', 'Idea'], warning: ['warning', '⚠️', 'Ojo'], caution: ['warning', '⚠️', 'Ojo'],
    aviso: ['warning', '⚠️', 'Ojo'], danger: ['danger', '❗', 'Cuidado'], nota: ['note', 'ℹ️', 'Nota']
  };
  const EMOJI_CALL = [[/^(💡|✅)/u, 'tip'], [/^(⚠️|⚠)/u, 'warning'], [/^(ℹ️|ℹ)/u, 'note'], [/^(❗|🚨|❌)/u, 'danger'], [/^(📌|🧠|✨|🔥)/u, 'idea']];

  function startsBlock(l, next) {
    return FENCE.test(l) || HEAD.test(l) || HR.test(l) || QUOTE.test(l) || LIST.test(l) || (l.indexOf('|') >= 0 && next != null && SEP.test(next));
  }

  function buildList(items) {
    let html = '';
    const stack = [];
    items.forEach(it => {
      while (stack.length && it.indent < stack[stack.length - 1].indent) html += '</li></' + stack.pop().tag + '>';
      const top = stack[stack.length - 1];
      const tag = it.ordered ? 'ol' : 'ul';
      if (!top || it.indent > top.indent) {
        html += '<' + tag + (it.ordered && it.start > 1 ? ' start="' + it.start + '"' : '') + '>';
        stack.push({ indent: it.indent, tag });
      } else {
        html += '</li>';
        if (top.tag !== tag) { html += '</' + stack.pop().tag + '><' + tag + '>'; stack.push({ indent: it.indent, tag }); }
      }
      html += '<li' + (it.task ? ' class="md-task' + (it.done ? ' done' : '') + '"' : '') + '>' +
        (it.task ? '<span class="md-check">' + (it.done ? '✓' : '') + '</span><span>' : '') + inline(it.text) + (it.task ? '</span>' : '');
    });
    while (stack.length) html += '</li></' + stack.pop().tag + '>';
    return html;
  }

  function render(src) {
    const lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
    const n = lines.length, out = [];
    let i = 0;
    while (i < n) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }

      let m = line.match(FENCE);
      if (m) {
        const lang = (m[1] || '').toLowerCase(), buf = [];
        i++;
        while (i < n && !/^\s*(?:```|~~~)\s*$/.test(lines[i])) buf.push(lines[i++]);
        i++;
        const code = buf.join('\n');
        const sc = /^(esquema|schema|mapa|arbol|árbol|tree|mindmap)$/.test(lang) ? scheme(code) : null;
        out.push(sc || codeBlock(code, sc === null && /^(esquema|schema|mapa|arbol|árbol|tree|mindmap)$/.test(lang) ? '' : lang));
        continue;
      }
      if ((m = line.match(HEAD))) { out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
      if (HR.test(line)) { out.push('<hr>'); i++; continue; }

      if (QUOTE.test(line)) {
        const buf = [];
        while (i < n && QUOTE.test(lines[i])) { buf.push(lines[i].match(QUOTE)[1]); i++; }
        let first = (buf[0] || '').trim(), type = null, title = '', body = buf;
        const mm = first.match(/^\[!(\w+)\]\s*(.*)$/);
        if (mm && CALL[mm[1].toLowerCase()]) {
          const c = CALL[mm[1].toLowerCase()];
          type = c[0]; title = c[1] + ' ' + (mm[2] || c[2]); body = buf.slice(1);
        } else {
          const ec = EMOJI_CALL.find(e => e[0].test(first));
          if (ec) type = ec[1];
        }
        if (type) out.push('<div class="md-callout ' + type + '">' + (title ? '<div class="md-callout-title">' + esc(title) + '</div>' : '') + render(body.join('\n')) + '</div>');
        else out.push('<blockquote>' + render(buf.join('\n')) + '</blockquote>');
        continue;
      }

      if (line.indexOf('|') >= 0 && i + 1 < n && SEP.test(lines[i + 1])) {
        const head = splitRow(line);
        const aligns = splitRow(lines[i + 1]).map(c => /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : 'left');
        i += 2;
        const rows = [];
        while (i < n && lines[i].trim() && lines[i].indexOf('|') >= 0) rows.push(splitRow(lines[i++]));
        let h = '<div class="md-table-wrap"><table><thead><tr>' + head.map((c, k) => '<th style="text-align:' + (aligns[k] || 'left') + '">' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
        rows.forEach(r => { h += '<tr>' + head.map((_, k) => '<td style="text-align:' + (aligns[k] || 'left') + '">' + inline(r[k] || '') + '</td>').join('') + '</tr>'; });
        out.push(h + '</tbody></table></div>');
        continue;
      }

      if ((m = line.match(LIST))) {
        const items = [];
        while (i < n) {
          const l = lines[i], lm = l.match(LIST);
          if (lm) {
            let text = lm[3], task = false, done = false;
            const tm = text.match(/^\[( |x|X)\]\s+(.*)$/);
            if (tm) { task = true; done = tm[1].toLowerCase() === 'x'; text = tm[2]; }
            const ordered = /\d/.test(lm[2]);
            items.push({ indent: lm[1].replace(/\t/g, '    ').length, ordered, start: ordered ? parseInt(lm[2], 10) : 1, text, task, done });
            i++;
          } else if (!l.trim()) {
            let j = i + 1; while (j < n && !lines[j].trim()) j++;
            if (j < n && LIST.test(lines[j])) i = j; else break;
          } else if (/^\s{2,}\S/.test(l) && items.length && !FENCE.test(l) && !HEAD.test(l)) {
            items[items.length - 1].text += '\n' + l.trim(); i++;
          } else break;
        }
        out.push(buildList(items));
        continue;
      }

      const buf = [lines[i++]];
      while (i < n && lines[i].trim() && !startsBlock(lines[i], lines[i + 1])) buf.push(lines[i++]);
      out.push('<p>' + inline(buf.join('\n')) + '</p>');
    }
    return out.join('');
  }
  return { render, esc };
})();

async function askAI(messages, mode, signal) {
  const res = await fetch(CFG.endpoint, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, mode: mode || CFG.mode }), signal
  });
  let data;
  try { data = await res.json(); } catch (e) { throw new Error('El servidor no devolvió una respuesta válida.'); }
  if (!res.ok) throw new Error(data.error || 'Error conectando con TOOLBOX AI.');
  if (!data.reply) throw new Error(data.error || 'TOOLBOX AI no devolvió ninguna respuesta.');
  return String(data.reply);
}

function buildPayload(conv) {
  const msgs = conv.messages.filter(m => !m.error).slice(-CFG.maxHistory).map(m => ({ role: m.role, content: m.content }));
  const lastUser = [...conv.messages].reverse().find(m => m.role === 'user');
  const hints = [];
  if (CFG.sendFormatHint) hints.push(FORMAT_HINT);
  const st = lastUser && STYLES.find(s => s.id === lastUser.style);
  if (st) hints.push(st.prompt);
  if (hints.length && msgs.length) {
    for (let i = msgs.length - 1; i >= 0; i--) {

    }
  }
  return msgs;
}

function cleanTitle(t) { return String(t || '').replace(/\s+/g, ' ').trim().slice(0, 60); }
function smartTitle(text) {
  let t = String(text || '').replace(/```[\s\S]*?```/g, ' ').replace(/[`*_#>\[\]()]/g, '').replace(/\s+/g, ' ').trim();
  t = t.replace(/^(hola|buenas|hey|oye|por favor|porfa)[,!.\s]+/i, '').replace(/^(puedes|podr[ií]as|me puedes|quiero que|necesito que|me ayudas a|ay[uú]dame a|dime|cu[eé]ntame)\s+/i, '');
  t = (t.split(/[.?!\n]/)[0] || t).trim();
  if (t.length > 38) t = t.slice(0, 38).replace(/\s+\S*$/, '') + '…';
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Nueva conversación';
}
function sanitizeTitle(raw) {
  let t = String(raw || '').split('\n').map(s => s.trim()).find(Boolean) || '';
  t = t.replace(/^(t[ií]tulo|title)\s*[:：-]\s*/i, '').replace(/^[#>*_\-\s"'“”«»`]+|[*_"'“”«»`.\s]+$/g, '').replace(/\s+/g, ' ').trim();
  if (!t || t.length > 70 || t.split(' ').length > 9) return '';
  if (t.length > 48) t = t.slice(0, 48).replace(/\s+\S*$/, '') + '…';
  return t.charAt(0).toUpperCase() + t.slice(1);
}
async function autoTitle(conv, force) {
  if (!CFG.autoTitle) return;
  if (!force && (conv.titleLocked || conv.titleAuto)) return;
  const r = R(conv.id);
  if (r.titling) return;
  const u = conv.messages.find(m => m.role === 'user');
  const a = conv.messages.find(m => m.role === 'assistant' && !m.error);
  if (!u || !a) return;
  r.titling = true; renderSidebar(); renderHeader();
  const cut = (s, n) => String(s).replace(/\s+/g, ' ').slice(0, n);
  const prompt = 'Eres un generador de títulos. Resume el tema de esta conversación en un título de 2 a 5 palabras, en español, ' +
    'sin comillas, sin punto final y sin emojis. Responde ÚNICAMENTE con el título.\n\nUsuario: ' + cut(u.content, 400) + '\nAsistente: ' + cut(a.content, 400);
  try {
    const t = sanitizeTitle(await askAI([{ role: 'user', content: prompt }], CFG.mode)) || smartTitle(u.content);
    if (conv.titleLocked && !force) return;
    conv.title = t; conv.titleAuto = true; if (force) conv.titleLocked = false;
    save(); animateTitle(conv.id, t);
  } catch (e) {
    if (force) toast('No se pudo generar el nombre. Inténtalo de nuevo.');
  } finally { r.titling = false; renderSidebar(); renderHeader(); }
}
function animateTitle(id, full) {
  const r = R(id); clearInterval(r.tt);
  let n = 0;
  r.tt = setInterval(() => {
    n++; r.shown = full.slice(0, n); paintTitle(id);
    if (n >= full.length) { clearInterval(r.tt); r.shown = null; paintTitle(id); }
  }, 32);
}

  const txt = R(id).shown != null ? R(id).shown : c.title;
  document.querySelectorAll('.conv-title[data-id="' + id + '"]').forEach(e => e.textContent = txt);

  conv.messages.forEach((m, i) => {
    const isLast = i === conv.messages.length - 1;
    th.appendChild(buildRow(conv, m, i, { isNew: opts.animateLast && isLast, reveal: opts.revealLast && isLast && m.role === 'assistant' && !m.error, isLast }));
  });
  if (R(conv.id).busy) th.appendChild(buildTyping());
  if (opts.keepScroll !== true) scrollBottom(false);
  else msgBox.scrollTo({ top: stick ? msgBox.scrollHeight : prevTop, behavior: 'instant' });
  updateSend(); renderHeader();
}
function startTypingRow() {
  const th = $('thread'); if ($('typingRow')) return;
  const w = th.querySelector('.welcome'); if (w) w.remove();
  th.appendChild(buildTyping()); if (stick) scrollBottom(false);
  const r = R(currentId); clearTimeout(r.typingTimer);
  r.typingTimer = setTimeout(() => { const l = $('typingLabel'); if (l) l.textContent = 'Sigue pensando… puedes pulsar ■ para cancelar'; }, 9000);
}
function stopTypingRow(id) { const t = $('typingRow'); if (t) t.remove(); if (id) clearTimeout(R(id).typingTimer); }

function startReveal(id, bubble, text) {
  const r = R(id);
  const total = text.length, frames = Math.min(200, Math.max(24, Math.round(total / 11))), step = Math.max(2, Math.ceil(total / frames));
  let pos = 0, raf = 0, done = false;
  bubble.classList.add('streaming');
  const content = bubble.querySelector('.md');
  const finish = () => {
    if (done) return; done = true; cancelAnimationFrame(raf);
    bubble.classList.remove('streaming'); content.innerHTML = MD.render(text);
    if (r.reveal && r.reveal.finish === finish) r.reveal = null;
    updateSend(); if (stick) scrollBottom(false);
  };
  const tick = () => {
    if (done) return;
    pos = Math.min(total, pos + step); content.innerHTML = MD.render(text.slice(0, pos));
    if (stick) scrollBottom(false);
    if (pos >= total) finish(); else raf = requestAnimationFrame(tick);
  };
  r.reveal = { finish }; updateSend();
  raf = requestAnimationFrame(tick);
}
function finishReveal() { Object.keys(rt).forEach(id => { if (rt[id].reveal) rt[id].reveal.finish(); }); }

function scrollBottom(smooth) { const m = $('messages'); m.scrollTo({ top: m.scrollHeight, behavior: smooth ? 'smooth' : 'instant' }); }
function onScroll() {
  const m = $('messages'); const gap = m.scrollHeight - m.scrollTop - m.clientHeight;
  stick = gap < 90; $('fab').hidden = gap < 260;
}

/* =========================================================
   CHIPS DE FORMATO + COMPOSER
========================================================= */
function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  STYLES.forEach(s => {
    const b = el('button', 'chip' + (pendingStyle === s.id ? ' on' : ''), s.icon + ' ' + s.label);
    b.type = 'button'; b.dataset.style = s.id; b.setAttribute('aria-pressed', pendingStyle === s.id); box.appendChild(b);
  });
  const st = STYLES.find(s => s.id === pendingStyle);
  $('styleHint').textContent = st ? '✦ ' + st.hint : '';
}
function setStyle(id) { pendingStyle = (pendingStyle === id) ? null : id; renderChips(); $('aiInput').focus(); }
function resizeInput() { const t = $('aiInput'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; }
function updateCounter() {
  const n = $('aiInput').value.length, c = $('counter');
  c.textContent = n; c.className = n > 11000 ? 'max' : n > 9000 ? 'warn' : '';
}
function updateSend() {
  const c = current(), r = c ? R(c.id) : null, b = $('sendBtn');
  const working = !!(r && (r.busy || r.reveal));
  b.classList.toggle('stop', working);
  b.textContent = working ? '■' : '➤';
  b.title = working ? 'Detener' : 'Enviar (Enter)'; b.setAttribute('aria-label', working ? 'Detener respuesta' : 'Enviar mensaje');
}

/* =========================================================
   ACCIONES
========================================================= */
function createConversation(focus) {
  const cur = current();
  if (cur && !cur.messages.length) { selectConv(cur.id); if (focus !== false) $('aiInput').focus(); return cur; }
  const now = Date.now();
  const c = normalizeConv({ id: String(now), title: 'Nueva conversación', messages: [], created: now, updated: now });
  conversations.unshift(c); save(); selectConv(c.id);
  if (focus !== false) $('aiInput').focus();
  return c;
}
function selectConv(id) {
  const prev = current(); if (prev) drafts[prev.id] = $('aiInput').value;
  finishReveal();
  currentId = id; renaming = null;
  $('aiInput').value = drafts[id] || ''; resizeInput(); updateCounter();
  stick = true;
  renderSidebar(); renderHeader(); renderThread(); closeSidebar();
}
async function send(textOverride) {
  const input = $('aiInput');
  const text = (typeof textOverride === 'string' ? textOverride : input.value).trim();
  if (!text) return;
  let c = current() || createConversation(false);
  const r = R(c.id);
  if (r.busy) return;
  if (r.reveal) r.reveal.finish();
  c.messages.push({ role: 'user', content: text, ts: Date.now(), style: pendingStyle || undefined });
  if (c.messages.filter(m => m.role === 'user').length === 1 && !c.titleLocked) { c.title = smartTitle(text); c.titleAuto = false; }
  touch(c); input.value = ''; delete drafts[c.id]; resizeInput(); updateCounter();
  pendingStyle = null; renderChips(); stick = true;
  save(); renderSidebar(); renderThread({ animateLast: true });
  await requestReply(c);
}
async function requestReply(c) {
  const r = R(c.id);
  r.busy = true; r.controller = new AbortController();
  if (c.id === currentId) startTypingRow(); updateSend();
  try {
    const reply = await askAI(buildPayload(c), CFG.mode, r.controller.signal);
    c.messages.push({ role: 'assistant', content: reply, ts: Date.now() }); touch(c); save();
    r.busy = false; r.controller = null;
    if (c.id === currentId) renderThread({ revealLast: true, keepScroll: true });
    else toast('✦ Nueva respuesta en “' + c.title + '”');
    renderSidebar();
    autoTitle(c, false);
  } catch (e) {
    r.busy = false; r.controller = null;
    if (e && e.name === 'AbortError') { toast('Respuesta detenida'); if (c.id === currentId) renderThread({ keepScroll: true }); }
    else {
      c.messages.push({ role: 'assistant', content: '❌ ' + (e && e.message ? e.message : 'Ha ocurrido un error.'), ts: Date.now(), error: true }); save();
      if (c.id === currentId) renderThread();
    }
  } finally { stopTypingRow(c.id); updateSend(); renderHeader(); }
}
function stopWork() {
  const c = current(); if (!c) return; const r = R(c.id);
  if (r.reveal) { r.reveal.finish(); return; }
  if (r.controller) r.controller.abort();
}
function regenerate() {
  const c = current(); if (!c || R(c.id).busy) return;
  const last = c.messages[c.messages.length - 1];
  if (last && last.role === 'assistant') c.messages.pop();
  save(); requestReply(c);
}
function retryError() {
  const c = current(); if (!c || R(c.id).busy) return;
  const last = c.messages[c.messages.length - 1];
  if (last && last.error) c.messages.pop();
  save(); requestReply(c);
}
function editMessage(idx) {
  const c = current(); if (!c || R(c.id).busy) return;
  const m = c.messages[idx]; if (!m || m.role !== 'user') return;
  c.messages = c.messages.slice(0, idx); touch(c); save();
  pendingStyle = m.style || null; renderChips();
  const inp = $('aiInput'); inp.value = m.content; resizeInput(); updateCounter();
  renderThread(); renderSidebar(); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  toast('Editando mensaje — pulsa Enter para reenviar');
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (_) {} t.remove(); }
  if (btn) { const old = btn.innerHTML; btn.classList.add('ok'); btn.textContent = '✓ Copiado'; setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = old; }, 1400); }
}
function togglePin(id) { const c = getConv(id); if (!c) return; c.pinned = !c.pinned; save(); renderSidebar(); renderHeader(); toast(c.pinned ? '📌 Conversación fijada' : 'Conversación desfijada'); }
async function deleteConv(id) {
  const c = getConv(id); if (!c) return;
  const ok = await confirmBox('¿Eliminar conversación?', '“' + c.title + '” se eliminará de este dispositivo. Podrás deshacerlo unos segundos.', 'Eliminar');
  if (!ok) return;
  const index = conversations.indexOf(c);
  conversations.splice(index, 1); lastDeleted = { c, index };
  if (currentId === id) { currentId = conversations.length ? [...conversations].sort((a, b) => b.updated - a.updated)[0].id : null; if (!currentId) { createConversation(false); } else selectConv(currentId); }
  save(); renderSidebar(); renderHeader(); renderThread();
  toast('Conversación eliminada', { action: 'Deshacer', onAction: () => { if (!lastDeleted) return; conversations.splice(Math.min(lastDeleted.index, conversations.length), 0, lastDeleted.c); const id2 = lastDeleted.c.id; lastDeleted = null; save(); selectConv(id2); toast('Conversación restaurada ✓'); } });
}
async function clearAll() {
  if (!conversations.length) return;
  const ok = await confirmBox('¿Borrar todas las conversaciones?', 'Se eliminarán las ' + conversations.length + ' conversaciones guardadas en este dispositivo. Esta acción no se puede deshacer.', 'Borrar todo');
  if (!ok) return;
  conversations = []; currentId = null; save(); createConversation(false); toast('Todo borrado');
}
function convToMarkdown(c) {
  const head = '# ' + c.title + '\n\n_Exportado de TOOLBOX AI · ' + new Date().toLocaleString('es-ES') + '_\n\n';
  return head + c.messages.filter(m => !m.error).map(m => (m.role === 'user' ? '### 🧑 Tú' : '### ✦ TOOLBOX AI') + '\n\n' + m.content).join('\n\n---\n\n') + '\n';
}
function convToText(c) { return c.title + '\n' + '='.repeat(Math.min(c.title.length, 60)) + '\n\n' + c.messages.filter(m => !m.error).map(m => (m.role === 'user' ? 'TÚ' : 'TOOLBOX AI') + ':\n' + m.content).join('\n\n----------\n\n') + '\n'; }
function download(name, text, mime) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'conversacion';
function menuAction(act) {
  const c = current(); closeMenu(); if (!c) return;
  if (act === 'rename') startRename(c.id, 'head');
  else if (act === 'retitle') { if (!c.messages.some(m => m.role === 'assistant' && !m.error)) toast('Haz primero una pregunta para poder titularla'); else { toast('✨ Buscando el mejor nombre…'); autoTitle(c, true); } }
  else if (act === 'pin') togglePin(c.id);
  else if (act === 'copy') { if (!c.messages.length) return toast('La conversación está vacía'); copyText(convToMarkdown(c)); toast('Conversación copiada ✓'); }
  else if (act === 'md') { if (!c.messages.length) return toast('La conversación está vacía'); download(slug(c.title) + '.md', convToMarkdown(c), 'text/markdown'); }
  else if (act === 'txt') { if (!c.messages.length) return toast('La conversación está vacía'); download(slug(c.title) + '.txt', convToText(c), 'text/plain'); }
  else if (act === 'delete') deleteConv(c.id);
}

/* =========================================================
   UI: toasts, modal, menús, tema, sidebar móvil
========================================================= */
function toast(msg, opt) {
  opt = opt || {};
  const t = el('div', 'toast'); t.appendChild(el('span', null, msg));
  if (opt.action) { const b = el('button', null, opt.action); b.type = 'button'; b.addEventListener('click', () => { opt.onAction && opt.onAction(); kill(); }); t.appendChild(b); }
  $('toasts').appendChild(t);
  const kill = () => { if (!t.parentNode) return; t.classList.add('out'); setTimeout(() => t.remove(), 260); };
  setTimeout(kill, opt.action ? 7000 : 2600);
}
let modalResolve = null;
function confirmBox(title, text, okLabel) {
  $('modalTitle').textContent = title; $('modalText').textContent = text; $('modalOk').textContent = okLabel || 'Aceptar';
  $('modal').hidden = false; $('modalOk').focus();
  return new Promise(res => { modalResolve = res; });
}
function closeModal(v) { $('modal').hidden = true; if (modalResolve) { modalResolve(v); modalResolve = null; } }
function closeMenu() { $('headMenu').hidden = true; $('moreBtn').setAttribute('aria-expanded', 'false'); }
function openSidebar() { $('sidebar').classList.add('open'); $('scrim').classList.add('show'); }
function closeSidebar() { $('sidebar').classList.remove('open'); $('scrim').classList.remove('show'); }
function setTheme(light) {
  document.body.classList.toggle('light', light); $('themeBtn').textContent = light ? '☀️' : '🌙';
  try { localStorage.setItem(CFG.themeKey, light ? 'light' : 'dark'); } catch (e) {}
}
function setOnline(on) { $('statusDot').classList.toggle('off', !on); $('statusText').textContent = on ? 'Groq conectado' : 'Sin conexión'; }

/* =========================================================
   EVENTOS
========================================================= */
function bind() {
  $('newChat').addEventListener('click', () => createConversation());
  $('newChatTop').addEventListener('click', () => createConversation());
  $('menuBtn').addEventListener('click', openSidebar);
  $('sbClose').addEventListener('click', closeSidebar);
  $('scrim').addEventListener('click', closeSidebar);
  $('themeBtn').addEventListener('click', () => setTheme(!document.body.classList.contains('light')));
  $('moreBtn').addEventListener('click', e => { e.stopPropagation(); const h = $('headMenu').hidden; $('headMenu').hidden = !h; $('moreBtn').setAttribute('aria-expanded', String(h)); });
  $('headMenu').addEventListener('click', e => { const b = e.target.closest('[data-menu]'); if (b) menuAction(b.dataset.menu); });
  document.addEventListener('click', e => { if (!e.target.closest('#headMenu') && !e.target.closest('#moreBtn')) closeMenu(); });
  $('clearAll').addEventListener('click', clearAll);
  $('modalOk').addEventListener('click', () => closeModal(true));
  $('modalCancel').addEventListener('click', () => closeModal(false));
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(false); });

  $('convSearch').addEventListener('input', renderSidebar);
  $('searchClear').addEventListener('click', () => { $('convSearch').value = ''; renderSidebar(); $('convSearch').focus(); });

  $('convList').addEventListener('click', e => {
    const item = e.target.closest('.conv-item'); if (!item) return;
    const id = item.dataset.id, a = e.target.closest('[data-a]');
    if (a) { e.stopPropagation(); if (a.dataset.a === 'rename') startRename(id, 'side'); else if (a.dataset.a === 'pin') togglePin(id); else if (a.dataset.a === 'delete') deleteConv(id); return; }
    if (e.target.closest('.rename-input')) return;
    if (id !== currentId) selectConv(id); else closeSidebar();
  });
  $('convList').addEventListener('dblclick', e => { const t = e.target.closest('.conv-title'); if (t) startRename(t.dataset.id, 'side'); });
  $('convList').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('conv-item')) selectConv(e.target.dataset.id); });

  $('thread').addEventListener('click', e => {
    const sug = e.target.closest('[data-sug]');
    if (sug) {
      const s = SUGGESTIONS[+sug.dataset.sug]; pendingStyle = s.style || null; renderChips();
      const inp = $('aiInput'); inp.value = s.text; resizeInput(); updateCounter(); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
      if (s.send !== false) send(); return;
    }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const c = current(); if (!c) return;
    if (b.dataset.act === 'copycode') { const code = b.closest('.md-code').querySelector('code').textContent; copyText(code, b); return; }
    const row = b.closest('.ai-row'); const idx = row ? +row.dataset.idx : -1; const m = c.messages[idx];
    if (b.dataset.act === 'copy' && m) copyText(m.content, b);
    else if (b.dataset.act === 'regen') regenerate();
    else if (b.dataset.act === 'retry') { if (!R(c.id).busy) requestReply(c); }
    else if (b.dataset.act === 'retry-error') retryError();
    else if (b.dataset.act === 'edit') editMessage(idx);
  });

  $('chips').addEventListener('click', e => { const b = e.target.closest('[data-style]'); if (b) setStyle(b.dataset.style); });
  const inp = $('aiInput');
  inp.addEventListener('input', () => { resizeInput(); updateCounter(); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); const c = current(); if (c && (R(c.id).busy || R(c.id).reveal)) return; send(); } });
  $('sendBtn').addEventListener('click', () => { const c = current(); if (c && (R(c.id).busy || R(c.id).reveal)) stopWork(); else send(); });
  $('messages').addEventListener('scroll', onScroll, { passive: true });
  $('fab').addEventListener('click', () => { stick = true; scrollBottom(true); });

  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openSidebar(); $('convSearch').focus(); $('convSearch').select(); }
    else if (e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); createConversation(); }
    else if (e.key === 'Escape') { if (!$('modal').hidden) closeModal(false); else { closeMenu(); closeSidebar(); } }
    else if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('aiInput').focus(); }
  });
  window.addEventListener('online', () => setOnline(true));
  window.addEventListener('offline', () => { setOnline(false); toast('Sin conexión a internet'); });
}

/* =========================================================
   INICIO
========================================================= */
(function init() {
  let light = false;
  try { light = localStorage.getItem(CFG.themeKey) === 'light'; } catch (e) {}
  setTheme(light); setOnline(navigator.onLine !== false);
  conversations = loadConversations();
  bind(); renderChips();
  if (!conversations.length) { createConversation(false); }
  else { const first = [...conversations].sort((a, b) => b.updated - a.updated)[0]; selectConv(first.id); }
  updateCounter(); resizeInput();
})();

</script>
</body>
